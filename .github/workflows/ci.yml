name: CI

# What lint-test.yml (from the template) doesn't cover: the suite on macOS, and
# the tests that need a real docker daemon.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci.sh

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-docker.sh
