# The smallest useful app: it answers every request with a description of that
# request. Nothing to configure, no data to lose, so it is the one to reach for
# when you want to see whether SpiriConfig itself is working.
#
# The spiriconfig.plugin.* labels also make it the smallest useful *plugin*: no
# UI framework, no X-Forwarded-Prefix awareness, nothing to break, so it exercises
# label discovery and the reverse proxy on their own, without the subpath and
# history-sync concerns a real NiceGUI plugin brings (see scripts/demo_target.py).
# It shows up as "Whoami" in the sidebar, framed at /app/whoami.
#
# No published port: the reverse proxy is the one way in, same as any other
# out-of-process plugin, so it inherits the login gate rather than sitting open
# on the host.
x-spiri-config-version: "1.10.1"

services:
  whoami:
    image: traefik/whoami:v1.10.1
    restart: unless-stopped
    labels:
      spiriconfig.plugin.name: whoami
      spiriconfig.plugin.port: "80"
      spiriconfig.plugin.title: Whoami
      spiriconfig.plugin.icon: badge
